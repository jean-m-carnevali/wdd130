<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Jean Marco Carnevali | BYU Idaho WDD 130 | Contact White Water Rafting.">
    <meta name="author" content="Jean Marco Carnevali">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo-wwr.png" alt="White Water Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>White Water Rafting Company</h1>
        <div class="info">
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewaterrafting.com</p>
        </div>


        <div class="content">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3314.8857327030405!2d-117.99485392429366!3d33.81526177324719!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80dd291668c42ac9%3A0x113bf3e753fff8e7!2sAdventure%20City!5e0!3m2!1ses-419!2sco!4v1785449693901!5m2!1ses-419!2sco"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <form class="form-item">
                <div class="form-item column2">
                    <label for="Name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder">
                </div>

                <div class="form-item column2">
                    <label for="Email">Email</label>
                    <input type="text" id="email" name="email" placeholder="Placeholder">
                </div>

                <div class="form-item column2">
                    <label for="purpose">Message Purpose</label>
                    <div>
                        <input type="radio" id="general" name="purpose" value="general">
                        <label for="general">General Inquiry</label>
                        <br>
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                        <br>
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                </div>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="3"
                      placeholder="Type here"></textarea>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please Suscribe me to the monthly newsletter</label>
                </div>
                <div class="form-item">
                    <button type="submit">Get in Touch!</button>
                </div>
            </form>
        </div>

        <div class="employees">
            <section>
                <h2>Where Are Here to Serve You</h2>
                <div class="employee">
                    <figure>
                        <img src="images/profile.jpg" alt="Photo of a whitewater rafting employee">
                        <figcaption>Employee Profile</figcaption>
                    </figure>
                    <figure>
                        <img src="images/profile.jpg" alt="Photo of a whitewater rafting employee">
                        <figcaption>Employee Profile</figcaption>
                    </figure>
                    <figure>
                        <img src="images/profile.jpg" alt="Photo of a whitewater rafting employee">
                        <figcaption>Employee Profile</figcaption>
                    </figure>
                </div>
            </section>
        </div>
    </main>
    <footer>
        <p>©2026 🌊 White Water Rafting 🌊 Jean Marco Carnevali</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" width="30" alt="Facebook Icon">
            </a>
            <a href="https://x.com">
                <img src="images/x-bw.svg" width="30" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-square.svg" width="30" alt="Instagram Icon">
            </a>
        </nav>
    </footer>


</body>

</html>
